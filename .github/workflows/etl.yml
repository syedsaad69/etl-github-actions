name: MY ETL Pipeline

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest

    steps:

      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run tests
      - name: Run tests
        run: pytest

      # 5. Run ETL pipeline
      - name: Run ETL pipeline
        run: python src/main.py

      # 6. Show database file
      - name: Show the database file exists
        run: ls -lh etl.db

      # 7. Check if extract.py changed and delete demo.txt
      - name: Delete demo.txt if extract.py changed
        if: github.event_name == 'push'
        run: |
          echo "Checking whether src/extract.py changed..."

          if git diff --name-only HEAD^ HEAD | grep -q '^src/extract.py$'; then

            echo "src/extract.py was changed."

            if [ -f demo.txt ]; then

              echo "demo.txt found. Deleting it..."

              rm demo.txt

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git add demo.txt

              git commit -m "Delete demo.txt because extract.py changed"

              git push

              echo "demo.txt deleted successfully."

            else

              echo "demo.txt does not exist."

            fi

          else

            echo "src/extract.py was not changed."
            echo "demo.txt will not be deleted."

          fi
