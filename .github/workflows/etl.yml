name: MY ETL Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run ETL pipeline
        run: python src/main.py

      - name: Show the database file exists
        run: ls -lh etl.db

      - name: Delete demo.txt if extract.py changed
        if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'src/extract.py')
        run: |
          if [ -f demo.txt ]; then
            rm demo.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add demo.txt
            git commit -m "Delete demo.txt because extract.py changed"
            git push
          fi
